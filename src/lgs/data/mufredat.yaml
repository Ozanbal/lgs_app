# 8. sınıf öğretim programlarına (2018 programı) göre LGS konu haritası.
#
# Her ünite:
#   id:                 soru bankasında kullanılan kalıcı kimlik (ders.konu)
#   kod:                MEB kazanım kodu öneki (biliniyorsa)
#   donem:              ünitenin işlendiği dönem (1/2); yalnızca kesin bilinenlerde dolu
#   kazanimlar:         {kod, ifade} listesi; kazanım düzeyinde etiketleme için
#   alt_konular:        daha kaba ayrım (kod biliniyorsa kodla)
#   anahtar_kelimeler:  otomatik etiketleyicinin kullandığı küçük harfli ipuçları
#
# Türkçe beceri temelli ölçüldüğü için Türkçe konuları çoğunlukla soru kalıbı
# üzerinden (soru_kaliplari.yaml -> uniteler) atanır.

turkce:
  - id: tur.sozcukte_anlam
    ad: Sözcükte Anlam (gerçek, mecaz, terim, yan anlam; deyim, atasözü)
    anahtar_kelimeler: [mecaz, gerçek anlam, terim anlam, yan anlam, deyim, atasözü, altı çizili sözcük, altı çizili söz]
  - id: tur.cumlede_anlam
    ad: Cümlede Anlam (anlam ilişkileri, öznel/nesnel, örtülü anlam)
    anahtar_kelimeler: [neden-sonuç, amaç-sonuç, koşul, karşılaştırma, öznel, nesnel, örtülü, ön yargı, varsayım]
  - id: tur.paragraf
    ad: Paragraf ve Metin Anlama (ana düşünce, yardımcı düşünce, konu, başlık, yapı)
    anahtar_kelimeler: [ana düşünce, asıl anlatılmak istenen, konusu, başlık, akışını bozan, paragraf]
  - id: tur.soz_sanatlari
    ad: Söz Sanatları
    anahtar_kelimeler: [kişileştirme, benzetme, abartma, konuşturma, söz sanatı]
  - id: tur.metin_turleri
    ad: Metin Türleri
    anahtar_kelimeler: [hikâye, roman, deneme, fıkra, makale, biyografi, otobiyografi, anı, gezi yazısı, masal, şiir, tiyatro]
  - id: tur.fiilimsiler
    ad: Fiilimsiler
    anahtar_kelimeler: [fiilimsi, isim-fiil, sıfat-fiil, zarf-fiil]
  - id: tur.cumlenin_ogeleri
    ad: Cümlenin Ögeleri
    anahtar_kelimeler: [öge, özne, yüklem, nesne, dolaylı tümleç, zarf tümleci]
  - id: tur.fiil_catisi
    ad: Fiilde Çatı
    anahtar_kelimeler: [etken, edilgen, geçişli, geçişsiz, çatı]
  - id: tur.cumle_turleri
    ad: Cümle Türleri
    anahtar_kelimeler: [basit cümle, birleşik cümle, sıralı cümle, bağlı cümle, isim cümlesi, fiil cümlesi, kurallı, devrik, eksiltili]
  - id: tur.yazim
    ad: Yazım Kuralları
    anahtar_kelimeler: [yazım yanlışı, yazımı]
  - id: tur.noktalama
    ad: Noktalama İşaretleri
    anahtar_kelimeler: [noktalama, virgül, noktalı virgül, iki nokta, kesme işareti, tırnak işareti, yay ayraç, kısa çizgi, üç nokta]
  - id: tur.anlatim_bozuklugu
    ad: Anlatım Bozuklukları
    anahtar_kelimeler: [anlatım bozukluğu]
  - id: tur.sozel_mantik
    ad: Sözel Mantık ve Muhakeme
    anahtar_kelimeler: [bilgilere göre, kesinlikle, sıralama, oturma, yerleştir]
  - id: tur.gorsel_okuma
    ad: Görsel, Grafik ve Tablo Okuma
    anahtar_kelimeler: [grafik, tablo, görsel, afiş]

matematik:
  - id: mat.carpanlar_katlar
    ad: Çarpanlar ve Katlar
    kod: M.8.1.1
    donem: 1
    kazanimlar:
      - {kod: M.8.1.1.1, ifade: "Verilen pozitif tam sayıların pozitif tam sayı çarpanlarını bulur, pozitif tam sayıların pozitif tam sayı çarpanlarını üslü ifadelerin çarpımı şeklinde yazar."}
      - {kod: M.8.1.1.2, ifade: "İki doğal sayının en büyük ortak bölenini (EBOB) ve en küçük ortak katını (EKOK) hesaplar, ilgili problemleri çözer."}
      - {kod: M.8.1.1.3, ifade: "Verilen iki doğal sayının aralarında asal olup olmadığını belirler."}
    anahtar_kelimeler: [ebob, ekok, asal, çarpan, '/\bkatı(dır|nı|ndan)?\b/', katları, ortak bölen, ortak kat, aralarında asal, bölen]
  - id: mat.uslu_ifadeler
    ad: Üslü İfadeler
    kod: M.8.1.2
    donem: 1
    kazanimlar:
      - {kod: M.8.1.2.1, ifade: "Tam sayıların, tam sayı kuvvetlerini hesaplar."}
      - {kod: M.8.1.2.2, ifade: "Üslü ifadelerle ilgili temel kuralları anlar, birbirine denk ifadeler oluşturur."}
      - {kod: M.8.1.2.3, ifade: "Sayıların ondalık gösterimlerini 10'un tam sayı kuvvetlerini kullanarak çözümler."}
      - {kod: M.8.1.2.4, ifade: "Verilen bir sayıyı 10'un farklı tam sayı kuvvetlerini kullanarak ifade eder."}
      - {kod: M.8.1.2.5, ifade: "Çok büyük ve çok küçük sayıları bilimsel gösterimle ifade eder ve karşılaştırır."}
    anahtar_kelimeler: [üslü, kuvveti, kuvvetleri, bilimsel gösterim, üssü]
  - id: mat.karekoklu_ifadeler
    ad: Kareköklü İfadeler
    kod: M.8.1.3
    donem: 1
    kazanimlar:
      - {kod: M.8.1.3.1, ifade: "Tam kare pozitif tam sayılarla bu sayıların karekökleri arasındaki ilişkiyi belirler."}
      - {kod: M.8.1.3.2, ifade: "Tam kare olmayan kareköklü bir sayının hangi iki doğal sayı arasında olduğunu belirler."}
      - {kod: M.8.1.3.3, ifade: "Kareköklü bir ifadeyi a√b şeklinde yazar ve a√b şeklindeki ifadede katsayıyı kök içine alır."}
      - {kod: M.8.1.3.4, ifade: "Kareköklü ifadelerde çarpma ve bölme işlemlerini yapar."}
      - {kod: M.8.1.3.5, ifade: "Kareköklü ifadelerde toplama ve çıkarma işlemlerini yapar."}
      - {kod: M.8.1.3.6, ifade: "Kareköklü bir ifade ile çarpıldığında, sonucu bir doğal sayı yapan çarpanlara örnek verir."}
      - {kod: M.8.1.3.7, ifade: "Ondalık ifadelerin kareköklerini belirler."}
      - {kod: M.8.1.3.8, ifade: "Gerçek sayıları tanır, rasyonel ve irrasyonel sayılarla ilişkilendirir."}
    anahtar_kelimeler: [karekök, "√", tam kare, irrasyonel, rasyonel, gerçek sayı]
  - id: mat.veri_analizi
    ad: Veri Analizi
    kod: M.8.4.1
    donem: 1
    kazanimlar:
      - {kod: M.8.4.1.1, ifade: "En fazla üç veri grubuna ait çizgi ve sütun grafiklerini yorumlar."}
      - {kod: M.8.4.1.2, ifade: "Verileri sütun, daire veya çizgi grafiği ile gösterir ve bu gösterimler arasında uygun olan dönüşümleri yapar."}
    anahtar_kelimeler: [sütun grafiği, çizgi grafiği, daire grafiği, grafik, veri]
  - id: mat.olasilik
    ad: Basit Olayların Olma Olasılığı
    kod: M.8.5.1
    donem: 1
    kazanimlar:
      - {kod: M.8.5.1.1, ifade: "Bir olaya ait olası durumları belirler."}
      - {kod: M.8.5.1.2, ifade: "“Daha fazla”, “eşit”, “daha az” olasılıklı olayları ayırt eder, örnek verir."}
      - {kod: M.8.5.1.3, ifade: "Eşit şansa sahip olan olaylarda her bir çıktının olasılık değerinin eşit olduğunu ve bu değerin 1/n olduğunu açıklar."}
      - {kod: M.8.5.1.4, ifade: "Olasılık değerinin 0 ile 1 arasında (0 ve 1 dâhil) olduğunu anlar."}
      - {kod: M.8.5.1.5, ifade: "Basit bir olayın olma olasılığını hesaplar."}
    anahtar_kelimeler: [olasılık, olasılığı, rastgele, zar, torba, eşit şans, kesin olay, imkânsız olay]
  - id: mat.cebirsel_ifadeler
    ad: Cebirsel İfadeler ve Özdeşlikler
    kod: M.8.2.1
    donem: 1
    kazanimlar:
      - {kod: M.8.2.1.1, ifade: "Basit cebirsel ifadeleri anlar ve farklı biçimlerde yazar."}
      - {kod: M.8.2.1.2, ifade: "Cebirsel ifadelerin çarpımını yapar."}
      - {kod: M.8.2.1.3, ifade: "Özdeşlikleri modellerle açıklar."}
      - {kod: M.8.2.1.4, ifade: "Cebirsel ifadeleri çarpanlara ayırır."}
    anahtar_kelimeler: [cebirsel ifade, özdeşlik, çarpanlarına ayır, terim, katsayı, iki kare farkı, cebir karo]
  - id: mat.dogrusal_denklemler
    ad: Doğrusal Denklemler
    kod: M.8.2.2
    donem: 2
    kazanimlar:
      - {kod: M.8.2.2.1, ifade: "Birinci dereceden bir bilinmeyenli denklemleri çözer."}
      - {kod: M.8.2.2.2, ifade: "Koordinat sistemini özellikleriyle tanır ve sıralı ikilileri gösterir."}
      - {kod: M.8.2.2.3, ifade: "Aralarında doğrusal ilişki bulunan iki değişkenden birinin diğerine bağlı olarak nasıl değiştiğini tablo ve denklem ile ifade eder."}
      - {kod: M.8.2.2.4, ifade: "Doğrusal denklemlerin grafiğini çizer."}
      - {kod: M.8.2.2.5, ifade: "Doğrusal ilişki içeren gerçek hayat durumlarına ait denklem, tablo ve grafiği oluşturur ve yorumlar."}
      - {kod: M.8.2.2.6, ifade: "Doğrunun eğimini modellerle açıklar, doğrusal denklemleri ve grafiklerini eğimle ilişkilendirir."}
    anahtar_kelimeler: [denklem, doğrusal, eğim, koordinat, sıralı ikili, x ekseni, y ekseni, orijin, doğru grafiği]
  - id: mat.esitsizlikler
    ad: Eşitsizlikler
    kod: M.8.2.3
    donem: 2
    kazanimlar:
      - {kod: M.8.2.3.1, ifade: "Birinci dereceden bir bilinmeyenli eşitsizlik içeren günlük hayat durumlarına uygun matematik cümleleri yazar."}
      - {kod: M.8.2.3.2, ifade: "Birinci dereceden bir bilinmeyenli eşitsizlikleri sayı doğrusunda gösterir."}
      - {kod: M.8.2.3.3, ifade: "Birinci dereceden bir bilinmeyenli eşitsizlikleri çözer."}
    anahtar_kelimeler: [eşitsizlik, sayı doğrusu, "≤", "≥"]
  - id: mat.ucgenler
    ad: Üçgenler
    kod: M.8.3.1
    donem: 2
    kazanimlar:
      - {kod: M.8.3.1.1, ifade: "Üçgende kenarortay, açıortay ve yüksekliği inşa eder."}
      - {kod: M.8.3.1.2, ifade: "Üçgenin iki kenar uzunluğunun toplamı veya farkı ile üçüncü kenarının uzunluğunu ilişkilendirir."}
      - {kod: M.8.3.1.3, ifade: "Üçgenin kenar uzunlukları ile bu kenarların karşısındaki açıların ölçülerini ilişkilendirir."}
      - {kod: M.8.3.1.4, ifade: "Yeterli sayıda elemanın ölçüleri verilen bir üçgeni çizer."}
      - {kod: M.8.3.1.5, ifade: "Pisagor bağıntısını oluşturur, ilgili problemleri çözer."}
    anahtar_kelimeler: [üçgen, pisagor, kenarortay, açıortay, yükseklik, hipotenüs, dik üçgen]
  - id: mat.eslik_benzerlik
    ad: Eşlik ve Benzerlik
    kod: M.8.3.2
    donem: 2
    kazanimlar:
      - {kod: M.8.3.2.1, ifade: "Eşlik ve benzerliği ilişkilendirir, eş ve benzer şekillerin kenar ve açı özelliklerini belirler."}
      - {kod: M.8.3.2.2, ifade: "Benzer çokgenlerin benzerlik oranını belirler, bir çokgene eş ve benzer çokgenler oluşturur."}
    anahtar_kelimeler: [benzer, benzerlik, benzerlik oranı, eş çokgen, ölçek]
  - id: mat.donusum_geometrisi
    ad: Dönüşüm Geometrisi
    kod: M.8.3.3
    donem: 2
    kazanimlar:
      - {kod: M.8.3.3.1, ifade: "Nokta, doğru parçası ve diğer düzlemsel şekillerin öteleme sonucundaki görüntülerini çizer."}
      - {kod: M.8.3.3.2, ifade: "Nokta, doğru parçası ve diğer düzlemsel şekillerin yansıma sonucundaki görüntülerini çizer."}
      - {kod: M.8.3.3.3, ifade: "Çokgenlerin öteleme ve yansımalar sonucunda ortaya çıkan görüntüsünü oluşturur."}
    anahtar_kelimeler: [öteleme, ötelen, yansıma, yansıması, dönüşüm, simetri, görüntüsü]
  - id: mat.geometrik_cisimler
    ad: Geometrik Cisimler
    kod: M.8.3.4
    donem: 2
    kazanimlar:
      - {kod: M.8.3.4.1, ifade: "Dik prizmaları tanır, temel elemanlarını belirler, inşa eder ve açınımını çizer."}
      - {kod: M.8.3.4.2, ifade: "Dik dairesel silindirin temel elemanlarını belirler, inşa eder ve açınımını çizer."}
      - {kod: M.8.3.4.3, ifade: "Dik dairesel silindirin yüzey alanı bağıntısını oluşturur, ilgili problemleri çözer."}
      - {kod: M.8.3.4.4, ifade: "Dik dairesel silindirin hacim bağıntısını oluşturur, ilgili problemleri çözer."}
      - {kod: M.8.3.4.5, ifade: "Dik piramidi tanır, temel elemanlarını belirler, inşa eder ve açınımını çizer."}
      - {kod: M.8.3.4.6, ifade: "Dik koniyi tanır, temel elemanlarını belirler, inşa eder ve açınımını çizer."}
    anahtar_kelimeler: [prizma, silindir, piramit, koni, açınım, hacim, yüzey alanı, küp]

