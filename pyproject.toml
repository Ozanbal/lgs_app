[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lgs"
version = "0.1.0"
description = "LGS soru bankası ve öğrenci performans analiz motoru"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "pdfplumber>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "reportlab>=4"]

[project.scripts]
lgs = "lgs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lgs = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
